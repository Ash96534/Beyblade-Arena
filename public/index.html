<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyblade Arena</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 1rem; left: 1rem; color: #fff; font-family: sans-serif; }
        .hp { font-size: 1.2rem; font-weight: bold; color: #ff4444; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="ui">
        <div class="hp">HP: <span id="hp">100</span></div>
        <div>Players: <span id="players">1</span></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const socket = io();

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let players = {};
        let myId = null;

        socket.on('init', (data) => {
            myId = data.id;
            players = data.players;
            document.getElementById('players').textContent = Object.keys(players).length;
        });

        socket.on('playerJoined', (player) => {
            players[player.id] = player;
            document.getElementById('players').textContent = Object.keys(players).length;
        });

        socket.on('playerUpdate', (player) => {
            players[player.id] = player;
        });

        socket.on('playerLeft', (id) => {
            delete players[id];
            document.getElementById('players').textContent = Object.keys(players).length;
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const [id, p] of Object.entries(players)) {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = id === myId ? '#00ff00' : '#ff0000';
                ctx.beginPath();
                ctx.arc(0, 0, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                if (id === myId) {
                    document.getElementById('hp').textContent = p.hp;
                }
            }

            requestAnimationFrame(draw);
        }

        draw();

        window.addEventListener('mousemove', (e) => {
            if (players[myId]) {
                const dx = e.clientX - players[myId].x;
                const dy = e.clientY - players[myId].y;
                players[myId].angle = Math.atan2(dy, dx);
                socket.emit('update', players[myId]);
            }
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
